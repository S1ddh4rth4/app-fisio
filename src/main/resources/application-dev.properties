# Database Configuration (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (clave solo para desarrollo local)
jwt.secret=dev-secret-key-app-fisio-2026-this-must-be-at-least-32-bytes!!

# Flyway deshabilitado en dev (H2 usa create-drop)
spring.flyway.enabled=false

# CORS
app.cors.allowed-origins=http://localhost:5173