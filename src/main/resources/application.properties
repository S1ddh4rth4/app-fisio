spring.application.name=app-fisio

# Perfil activo por defecto (dev para local, se sobrescribe en docker con prod)
spring.profiles.active=dev

# Google Calendar Configuration (compartida)
google.calendar.credentials.path=classpath:google-credentials.json
google.calendar.id=app.fisio420@gmail.com

app.security.encryption-secret=${ENCRYPTION_SECRET:ClaveSecretaSuperSeguraDe32Bytes}

# Configuración de Correo SMTP (Gmail gratis hasta 500 correos/día)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:app.fisio420@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL pública del portal para el botón dentro del correo
app.frontend.url=${APP_FRONTEND_URL:https://appfisio.online}