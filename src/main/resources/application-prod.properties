# Database Configuration (Oracle con variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:system}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console deshabilitada en produccion
spring.h2.console.enabled=false

# JWT Configuration (obligatorio desde variable de entorno)
jwt.secret=${JWT_SECRET}

# Flyway Migrations
spring.flyway.baseline-on-migrate=true

# CORS (configurable desde variable de entorno)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost}

# Spring Boot Actuator (Monitoreo y Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never