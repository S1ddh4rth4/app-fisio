services:
  oracledb:
    image: gvenzl/oracle-xe:21-slim
    container_name: appfisio-oracle
    restart: always
    environment:
      - ORACLE_PASSWORD=${ORACLE_SYSTEM_PASSWORD:-oracle}
      - APP_USER=${ORACLE_APP_USER:-appfisio}
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD:-appfisio}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fisio-backend
    restart: always
    depends_on:
      oracledb:
        condition: service_healthy
    environment:
      TZ: America/Mexico_City
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracledb:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: ${ORACLE_APP_USER:-appfisio}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_APP_PASSWORD:-appfisio}
      JWT_SECRET: "${JWT_SECRET:?ERROR_CRITICO - JWT_SECRET no esta definido en el archivo .env}"
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:?ERROR_CRITICO - ENCRYPTION_SECRET no esta definido en el archivo .env}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173,http://localhost}
      MAIL_USERNAME: ${MAIL_USERNAME:-app.fisio420@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://appfisio.online}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fisio-frontend
    restart: always
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"

volumes:
  oracle_data:
